name: Regression checks

on:
  pull_request:
    branches: [main, feat/complete-maintenance, feat/sandbox-billing-foundation]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Tests use an in-memory PGlite database and synthetic users only.
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          # Reads the exact pnpm version from package.json#packageManager.
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Calendar, model lookup and PGlite storage regression tests
        run: pnpm test
      - name: Isolated app account lifecycle tests
        run: node --test ios/Tests/*test.mjs
      - name: Production build without cloud credentials
        run: pnpm build

name: Additive billing identity migration checks
on:
  pull_request:
    branches: [main, feat/sandbox-billing-foundation]
    paths: ['supabase/migrations/**', 'tests/billing-identity-server.integration.mjs', 'tests/fixtures/auth/**', '.github/workflows/billing-identity-migration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identity-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Start disposable database and Auth without SMTP
        run: docker compose -p ouchi-identity-ci -f tests/fixtures/auth/compose.yml up -d --wait --wait-timeout 120 db auth
      - name: Apply existing household migrations and additive identity migration
        run: |
          for file in tests/fixtures/auth/rest-bootstrap.sql supabase/migrations/20261001144732_household_storage.sql supabase/migrations/20261001232931_atomic_import.sql supabase/migrations/20261001233450_household_sharing.sql supabase/migrations/20261001235138_account_data_erasure.sql supabase/migrations/20261002004530_push_reminders.sql supabase/migrations/20261005134316_cloud_backup_restore.sql supabase/migrations/20261010141353_ouchi_billing_identity.sql supabase/migrations/20261010142053_ouchi_verified_transaction_ledger.sql; do
            docker compose -p ouchi-identity-ci -f tests/fixtures/auth/compose.yml exec -T db psql -U postgres -d auth_test -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Start disposable data API
        run: docker compose -p ouchi-identity-ci -f tests/fixtures/auth/compose.yml --profile data-api up -d --wait --wait-timeout 120 rest
      - name: Verify migration through actual Auth and PostgREST
        env:
          OUCHI_IDENTITY_MIGRATION_TEST: 'true'
        run: node --test tests/billing-identity-server.integration.mjs
      - name: Diagnose disposable failure
        if: failure()
        run: docker compose -p ouchi-identity-ci -f tests/fixtures/auth/compose.yml --profile data-api logs --no-color --tail 100 auth db rest
      - name: Remove only disposable test containers and volumes
        if: always()
        run: docker compose -p ouchi-identity-ci -f tests/fixtures/auth/compose.yml --profile data-api down --volumes

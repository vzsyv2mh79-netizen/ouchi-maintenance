name: Native enrollment recovery
on:
  pull_request:
    branches: [main, feat/native-household-core, feat/sandbox-billing-foundation]
    paths:
      - 'ios/OuchiMaintenance/NativeStore.swift'
      - 'ios/scripts/test-enrollment-without-snapshot.py'
      - '.github/workflows/native-enrollment-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enrollment-method:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Execute actual enrollment method with isolated doubles
        run: python3 ios/scripts/test-enrollment-without-snapshot.py

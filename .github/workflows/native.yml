name: Native iPhone checks

on:
  pull_request:
    branches: [main, feat/sandbox-billing-foundation]
    paths: ['ios/**', 'lib/product-lookup.ts', 'lib/reminder-settings.ts', 'lib/billing-body.ts', 'lib/billing.ts', 'lib/maintenance-report.ts', 'lib/account-deletion-request.ts', 'lib/account-deletion-progress.ts', 'lib/account-enrollment-service.ts', 'lib/verified-app-session.ts', 'package.json', 'pnpm-lock.yaml', '.github/workflows/native.yml']
  push:
    branches: [main]
    paths: ['ios/**', 'lib/reminder-settings.ts', 'lib/billing-body.ts', 'lib/billing.ts', 'lib/maintenance-report.ts', 'lib/account-deletion-request.ts', 'lib/account-deletion-progress.ts', 'lib/account-enrollment-service.ts', 'lib/verified-app-session.ts', 'package.json', 'pnpm-lock.yaml', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # Standard runner: public repository, no paid larger runner/cache/artifacts.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify selected Xcode and iPhoneOS submission minimum SDK
        run: python3 ios/scripts/verify-submission-toolchain.py
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Export current full Web model catalog for native contract checks
        run: node ios/Tests/export-web-catalog.mjs "$RUNNER_TEMP/ouchi-catalog.json"
      - name: Install locked dependencies without install hooks
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Native HTTP billing, settings, reports and deletion contracts
        run: node ios/Tests/reminder-http.mjs --sdk "$(xcrun --sdk macosx --show-sdk-path)"
      - name: Formal native push registration HTTP transport with synthetic device token
        run: node ios/Tests/formal-native-push-http.mjs --sdk "$(xcrun --sdk macosx --show-sdk-path)"
      - name: Native attachment HTTP transport with synthetic files
        run: node ios/Tests/attachment-http.mjs --sdk "$(xcrun --sdk macosx --show-sdk-path)"
      - name: Native formal report HTTP transport with synthetic records
        run: node ios/Tests/formal-report-http.mjs --sdk "$(xcrun --sdk macosx --show-sdk-path)"
      - name: Native free notification channels actual HTTP contract
        run: node ios/Tests/formal-notification-channel-http.mjs --sdk "$(xcrun --sdk macosx --show-sdk-path)"
      - name: Native free enrollment actual HTTP contract
        run: node ios/Tests/account-enrollment-http.mjs --sdk "$(xcrun --sdk macosx --show-sdk-path)"
      - name: Native closure review actual HTTP and protected restart
        run: node ios/Tests/closure-review-http.mjs --sdk "$(xcrun --sdk macosx --show-sdk-path)"
      - name: Native family handoff actual HTTP and protected restart
        run: node ios/Tests/home-handoff-http.mjs --sdk "$(xcrun --sdk macosx --show-sdk-path)"
      - name: Verify synthetic core and local snapshot tests
        run: python3 ios/scripts/verify-native.py --sdk "$(xcrun --sdk macosx --show-sdk-path)" --catalog "$RUNNER_TEMP/ouchi-catalog.json"
      - name: Swift package tests
        run: swift test --package-path ios
      - name: Release package configuration rejects isolated loopback
        run: swift test --package-path ios --configuration release
      - name: Unsigned iPhone Release build without cloud credentials
        run: >-
          xcodebuild -project ios/OuchiMaintenance.xcodeproj
          -scheme OuchiMaintenance -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/ouchi-release"
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify built Release product SDK metadata
        run: python3 ios/scripts/verify-submission-toolchain.py --product-plist "$RUNNER_TEMP/ouchi-release/Build/Products/Release-iphoneos/OuchiMaintenance.app/Info.plist"
      - name: Unsigned iPhone Debug build covers isolated development UI
        run: >-
          xcodebuild -project ios/OuchiMaintenance.xcodeproj
          -scheme OuchiMaintenance -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/ouchi-debug"
          CODE_SIGNING_ALLOWED=NO build
